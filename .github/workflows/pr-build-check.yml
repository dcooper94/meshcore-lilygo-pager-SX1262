name: PR Build Check

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'
  push:
    branches: [main, dev]
    paths:
      - 'src/**'
      - 'examples/**'
      - 'variants/**'
      - 'platformio.ini'
      - '.github/workflows/pr-build-check.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        environment:
          - T_LoRa_Pager_SX1262_companion_radio_usb

    steps:
      - name: Clone Repo
        uses: actions/checkout@v6

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.environment }}
        run: pio run -e ${{ matrix.environment }}

  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install clang-format
        run: pip install 'clang-format==20.1.0'

      - name: Check pager variant formatting
        run: |
          files=$(git ls-files 'variants/lilygo_tlora_pager_sx1262/*.cpp' \
                               'variants/lilygo_tlora_pager_sx1262/*.h' \
                    | grep -v 'lv_conf.h')
          echo "Checking:"; echo "$files"
          clang-format --style=file --dry-run -Werror $files
