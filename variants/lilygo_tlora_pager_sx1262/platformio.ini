; LilyGo T-LoRa Pager — SX1262 variant (cloned from the LR1121 variant)
; Hardware: ESP32-S3-N16R8 + SX1262 (sub-GHz), ST7796 IPS 480x222,
; TCA8418 keyboard, encoder, GPS, NFC ST25R3916, ES8311 audio, XL9555.
; Pinmap source: wiki.lilygo.cc T-LoRaPager Quick Start (Pin Definitions)

[T_LoRa_Pager_SX1262]
extends = esp32_base
board = esp32-s3-devkitc-1
build_flags =
 ${esp32_base.build_flags}
 -I variants/lilygo_tlora_pager_sx1262
 -D T_LORA_PAGER_SX1262

 ; --- SX1262 radio (MeshCore CustomSX1262 wrapper) ---
 -D USE_SX1262
 -D RADIO_CLASS=CustomSX1262
 -D WRAPPER_CLASS=CustomSX1262Wrapper
 -D LORA_TX_POWER=22
 ; --- Default preset: Australia Mid (915.075 MHz, BW 125, SF9, CR5) ---
 -D LORA_FREQ=915.075
 -D LORA_BW=125
 -D LORA_SF=9
 -D LORA_CR=5
 -D SX126X_DIO2_AS_RF_SWITCH=true
 -D SX126X_DIO3_TCXO_VOLTAGE=1.8
 -D SX126X_RX_BOOSTED_GAIN=1
 -D SX126X_CURRENT_LIMIT=140

 ; --- LoRa pinmap (T-Pager SX1262) ---
 -D P_LORA_NSS=36
 -D P_LORA_DIO_1=14
 -D P_LORA_RESET=47
 -D P_LORA_BUSY=48
 -D P_LORA_SCLK=35
 -D P_LORA_MISO=33
 -D P_LORA_MOSI=34

 ; --- Shared I2C bus ---
 -D PIN_BOARD_SDA=3
 -D PIN_BOARD_SCL=2

 ; --- GPS (UART1) — same pin convention as the LR1121 variant ---
 -D PIN_GPS_RX=12
 -D PIN_GPS_TX=4
 -D GPS_BAUD_RATE=38400
 -D ENV_INCLUDE_GPS=1
 -D ENV_SKIP_GPS_DETECT=1
 -D PERSISTANT_GPS=1
 ; NOTE: PERSISTANT_GPS keeps the sensor stack polling; PowerManager
 ; duty-cycles the GPS power rail (XL9555 IO4) on top of that.

 ; --- Audio (ES8311) ---
 -D BOARD_I2S_WS=18
 -D BOARD_I2S_BCK=11
 -D BOARD_I2S_MCLK=10
 -D BOARD_I2S_DOUT=45
 -D BOARD_I2S_DIN=17
 -D AUDIO_DEFAULT_VOLUME=60
 -D AUDIO_ENABLED_DEFAULT=1

 ; --- Power policy (PowerManager) ---
 -D SCREEN_DIM_SECS=30
 -D SCREEN_OFF_SECS=90
 -D GPS_ON_SECS=30
 -D GPS_OFF_SECS=270
 -D POWER_DISABLE_BLE=1
 ; set to 0 to re-enable BLE/phone companion (costs ~30-80 mA)

 ; --- Side / BOOT button (GPIO 0 = right-hand physical button) ---
 ; GPIO 0 is the ESP32-S3 boot-strapping pin — see UITask.cpp for the 5 s
 ; boot guard that prevents accidental power-off during pin settling.
 -D PIN_SIDE_BTN=0

 ; --- USB-CDC serial ---
 -D ARDUINO_USB_MODE=1
 -D ARDUINO_USB_CDC_ON_BOOT=1

 ; --- PSRAM ---
 -D BOARD_HAS_PSRAM

board_build.partitions = variants/lilygo_tlora_pager_sx1262/partitions.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 16MB
board_upload.maximum_size = 5242880
board_build.f_flash = 80000000L
board_build.flash_mode = dio

build_src_filter = ${esp32_base.build_src_filter}
 +<../variants/lilygo_tlora_pager_sx1262>
 +<../variants/lilygo_tlora_pager_sx1262/AudioManager.cpp>
 +<../variants/lilygo_tlora_pager_sx1262/PowerManager.cpp>
 +<helpers/sensors>

lib_deps =
 ${esp32_base.lib_deps}
 stevemarple/MicroNMEA @ ^2.0.6
 lovyan03/LovyanGFX @ ^1.2.7
 adafruit/Adafruit TCA8418 @ ^1.0.1
 lvgl/lvgl @ ~9.2.2

; ============ Companion firmware over USB serial ============
[env:T_LoRa_Pager_SX1262_companion_radio_usb]
extends = T_LoRa_Pager_SX1262
build_flags =
 ${T_LoRa_Pager_SX1262.build_flags}
 -I variants/lilygo_tlora_pager_sx1262
 -I examples/companion_radio/ui-new
 -D MAX_CONTACTS=350
 -D MAX_GROUP_CHANNELS=40
 -D OFFLINE_QUEUE_SIZE=256
 -D DISPLAY_CLASS=TPagerST7796Display
 -D UI_ZOOM=2
 -D PIN_USER_BTN=7
 -D PIN_ENCODER_A=40
 -D PIN_ENCODER_B=41
 -D LV_CONF_INCLUDE_SIMPLE
 -D LV_LVGL_H_INCLUDE_SIMPLE
build_src_filter = ${T_LoRa_Pager_SX1262.build_src_filter}
 +<helpers/esp32/*.cpp>
 +<helpers/ui/LGFXDisplay.cpp>
 +<../examples/companion_radio/*.cpp>
 +<../examples/companion_radio/ui-new/*.cpp>
 -<../examples/companion_radio/ui-new/UITask.cpp>
 +<../variants/lilygo_tlora_pager_sx1262/UITask.cpp>
 +<../variants/lilygo_tlora_pager_sx1262/TPagerLVGL.cpp>
lib_deps =
 ${T_LoRa_Pager_SX1262.lib_deps}
 densaugeo/base64 @ ~1.4.0